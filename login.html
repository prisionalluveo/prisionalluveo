<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login — Sistema Prisional</title>
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-box">
      <h1>🔒 Sistema Prisional</h1>
      <label>Usuário (e-mail)</label>
      <input id="email" type="email" placeholder="seuemail@exemplo.com">
      <label>Senha</label>
      <input id="senha" type="password" placeholder="••••••••">

      <div class="cf-turnstile" style="margin-top:14px" data-sitekey="0x4AAAAAAEsJEdJh4vhxBKjX" data-callback="turnstileOk"></div>

      <button class="btn" style="width:100%" onclick="entrar()" id="btnEntrar" disabled>Entrar</button>
      <div id="mensagem" class="msg"></div>
    </div>
  </div>

  <script src="supabaseClient.js"></script>
  <script>
    let tokenCaptcha = null

    function turnstileOk(token) {
      tokenCaptcha = token
      document.getElementById('btnEntrar').disabled = false
    }

    async function entrar() {
      const email = document.getElementById('email').value.trim()
      const senha = document.getElementById('senha').value
      const msg = document.getElementById('mensagem')
      msg.textContent = ''

      if (!email || !senha) {
        msg.textContent = 'Preencha usuário e senha.'
        msg.className = 'msg erro'
        return
      }
      if (!tokenCaptcha) {
        msg.textContent = 'Aguarde a verificação de segurança carregar.'
        msg.className = 'msg erro'
        return
      }

      const { error } = await supabaseClient.auth.signInWithPassword({
        email,
        password: senha,
        options: { captchaToken: tokenCaptcha },
      })

      if (error) {
        msg.textContent = 'Usuário ou senha inválidos.'
        msg.className = 'msg erro'
        // token do Turnstile é de uso único — reseta o widget pra tentar de novo
        if (window.turnstile) window.turnstile.reset()
        tokenCaptcha = null
        document.getElementById('btnEntrar').disabled = true
        return
      }
      window.location.href = 'index.html'
    }

    // se já estiver logado, pula direto pro dashboard
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html'
    })
  </script>
</body>
</html>
