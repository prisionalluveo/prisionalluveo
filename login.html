<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login — Sistema Prisional</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-box">
      <h1>🔒 Sistema Prisional</h1>
      
      <form id="form-login" onsubmit="entrar(event)">
        <label for="email">Usuário (e-mail)</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com" required autocomplete="username">
        
        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="••••••••" required autocomplete="current-password">

        <button class="btn" style="width:100%; margin-top:14px;" type="submit" id="btnEntrar">Entrar</button>
      </form>

      <div id="mensagem" class="msg" style="margin-top:10px;"></div>
      
      <p style="text-align:center; margin-top:16px">
        <a href="esqueci-senha.html">Esqueci minha senha</a>
      </p>
    </div>
  </div>

  <script src="supabaseClient.js"></script>
  <script>
    async function entrar(e) {
      if (e) e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const msg = document.getElementById('mensagem');
      const btn = document.getElementById('btnEntrar');

      msg.textContent = '';
      msg.className = 'msg';

      if (!email || !senha) {
        msg.textContent = 'Preencha usuário e senha.';
        msg.className = 'msg erro';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Aguarde...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: senha
      });

      if (error) {
        msg.textContent = 'Usuário ou senha inválidos.';
        msg.className = 'msg erro';
        btn.disabled = false;
        btn.textContent = 'Entrar';
        return;
      }

      window.location.href = 'index.html';
    }

    // Se já estiver logado, redireciona para o dashboard
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
