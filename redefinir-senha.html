<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redefinir Senha - Sistema Prisional</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
</head>
<body>
  <div class="login-container">
    <h2>🔒 Redefinir Senha</h2>
    <form id="form-redefinir">
      <label>Nova Senha:</label>
      <input type="password" id="nova-senha" required placeholder="Digite a nova senha">
      <button type="submit" class="btn">Atualizar Senha</button>
    </form>
    <p id="mensagem" style="margin-top: 10px;"></p>
  </div>

  <script>
    const form = document.getElementById('form-redefinir');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const novaSenha = document.getElementById('nova-senha').value;

      mensagem.textContent = "Atualizando...";

      // Chama a função do Supabase Auth para redefinir a senha do usuário autenticado via link
      const { data, error } = await supabaseClient.auth.updateUser({
        password: novaSenha
      });

      if (error) {
        mensagem.style.color = "red";
        mensagem.textContent = "Erro ao redefinir: " + error.message;
      } else {
        mensagem.style.color = "green";
        mensagem.textContent = "Senha alterada com sucesso! Redirecionando para o login...";
        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);
      }
    });
  </script>
</body>
</html>
