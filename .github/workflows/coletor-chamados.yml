name: Coletor de Chamados (Prisional)

on:
  schedule:
    - cron: '*/30 * * * *'   # a cada 30 minutos
  workflow_dispatch:          # também permite rodar manualmente pelo GitHub

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Rodar o coletor
        env:
          TERA_USER: ${{ secrets.TERA_USER }}
          TERA_PASS: ${{ secrets.TERA_PASS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python coletor_helpdesk_prisional.py
