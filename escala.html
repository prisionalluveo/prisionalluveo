<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Escala de Manutenção — Sistema Prisional</title>
<link rel="stylesheet" href="estilo.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topo">
    <div class="marca">🔒 Sistema Prisional</div>
    <nav>
      <a href="index.html">Dashboard</a>
      <a href="inventario.html">Inventário</a>
      <a href="infraestrutura.html">Infraestrutura</a>
      <a href="plantao.html">Plantão</a>
      <a href="escala.html">Escala de Manutenção</a>
      <a href="ordens.html">Ordens de Compra</a>
      <a href="projetos.html">Projetos</a>
      <a href="usuarios.html" class="somente-admin">Usuários</a>
    </nav>
    <button onclick="sair()">Sair</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>🗓️ Agendar visita de manutenção</h2>

      <label>Unidade</label>
      <select id="unidade"></select>

      <label>Data</label>
      <input id="data" type="date">

      <label>Técnico responsável</label>
      <input id="tecnico" placeholder="Nome do técnico">

      <label>Observação</label>
      <textarea id="observacao" placeholder="O que será verificado, motivo da visita, etc. (opcional)"></textarea>

      <button class="btn" onclick="salvar()">Agendar</button>
      <div id="mensagem" class="msg"></div>
    </div>

    <div class="card">
      <h2>Próximas visitas agendadas</h2>
      <table>
        <thead>
          <tr><th>Data</th><th>Unidade</th><th>Técnico</th><th>Observação</th><th></th></tr>
        </thead>
        <tbody id="listaEscala"></tbody>
      </table>
    </div>
  </div>

  <script src="supabaseClient.js"></script>
  <script>
    async function iniciar() {
      const sessao = await exigirLogin()
      if (!sessao) return
      await aplicarPermissoesNav(sessao)

      const selUnidade = document.getElementById('unidade')
      UNIDADES.forEach(u => selUnidade.appendChild(new Option(u, u)))

      document.getElementById('data').value = new Date().toISOString().slice(0, 10)
      carregarLista()
    }

    async function salvar() {
      const msg = document.getElementById('mensagem')
      msg.textContent = ''

      const unidade = document.getElementById('unidade').value
      const data = document.getElementById('data').value
      const tecnico = document.getElementById('tecnico').value.trim()
      const observacao = document.getElementById('observacao').value.trim() || null

      if (!unidade || !data || !tecnico) {
        msg.textContent = 'Preencha unidade, data e técnico.'
        msg.className = 'msg erro'
        return
      }

      const { error } = await supabaseClient.from('escala_manutencao').insert({ unidade, data, tecnico, observacao })
      if (error) {
        msg.textContent = error.code === '23505'
          ? 'Já existe uma visita agendada pra essa unidade nessa data.'
          : 'Erro ao salvar: ' + error.message
        msg.className = 'msg erro'
        return
      }

      msg.textContent = 'Visita agendada.'
      msg.className = 'msg sucesso'
      document.getElementById('tecnico').value = ''
      document.getElementById('observacao').value = ''
      carregarLista()
    }

    async function excluir(id) {
      if (!confirm('Cancelar essa visita agendada?')) return
      await supabaseClient.from('escala_manutencao').delete().eq('id', id)
      carregarLista()
    }

    async function carregarLista() {
      const { data: registros } = await supabaseClient
        .from('escala_manutencao')
        .select('*')
        .order('data', { ascending: true })

      const corpo = document.getElementById('listaEscala')
      corpo.innerHTML = ''
      ;(registros || []).forEach(r => {
        const tr = document.createElement('tr')
        tr.innerHTML = `
          <td>${new Date(r.data + 'T00:00:00').toLocaleDateString('pt-BR')}</td>
          <td>${r.unidade}</td>
          <td>${r.tecnico}</td>
          <td>${r.observacao || '—'}</td>
          <td><a href="#" onclick='excluir(${r.id}); return false;'>cancelar</a></td>
        `
        corpo.appendChild(tr)
      })
    }

    iniciar()
  </script>
</body>
</html>
